name: RLP-781 Linux worker capability proof
run-name: RLP-781 capability proof ${{ inputs.proof_id }}

'on':
  workflow_dispatch:
    inputs:
      proof_id:
        description: Unique task proof ID
        required: true
        type: string
      archive_sha256:
        description: Exact compressed worker SHA256
        required: true
        type: string
      binary_sha256:
        description: Exact final worker binary SHA256
        required: true
        type: string

permissions:
  contents: read

jobs:
  capability-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the dispatched exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify final bytes and run capabilities without load
        timeout-minutes: 1
        env:
          PROOF_ID: ${{ inputs.proof_id }}
          PROOF_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PROOF_BINARY_SHA256: ${{ inputs.binary_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, shutil, subprocess, tarfile

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(platform.system() == 'Linux' and platform.machine() == 'x86_64',
                  'Capability proof requires native Linux/amd64.')
          require(os.environ['GITHUB_REPOSITORY'] == 'alambertt/relampo_testing-distribute',
                  'This proof is restricted to the owned execution repository.')
          require(os.environ['GITHUB_REF'].startswith('refs/heads/RLP-562-capability-proof-'),
                  'This proof requires a task-owned capability ref.')
          require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Use a fresh proof run.')
          require(re.fullmatch(r'[A-Za-z0-9-]{1,64}', os.environ['PROOF_ID']), 'Invalid proof ID.')
          for key in ('PROOF_ARCHIVE_SHA256', 'PROOF_BINARY_SHA256'):
              require(re.fullmatch(r'[a-f0-9]{64}', os.environ[key]), 'Invalid expected SHA256.')

          def digest(path):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()

          payload = pathlib.Path('.relampo/capability-proof')
          archive = payload / 'relampo-worker.tar.gz'
          checksum = payload / 'relampo-worker.tar.gz.sha256'
          expected_archive = os.environ['PROOF_ARCHIVE_SHA256']
          require(archive.is_file() and checksum.is_file(), 'Missing worker payload/checksum.')
          require(checksum.read_text().split() == [expected_archive, 'relampo-worker.tar.gz'],
                  'Payload checksum disagrees with dispatch input.')
          require(digest(archive) == expected_archive, 'Compressed worker digest mismatch.')

          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'relampo-capability-proof'
          scratch.mkdir(exist_ok=False)
          binary = scratch / 'relampo-worker'
          with tarfile.open(archive, 'r:gz') as packed:
              members = packed.getmembers()
              require(len(members) == 1 and members[0].name == 'relampo-worker' and members[0].isfile(),
                      'Worker archive must contain one regular relampo-worker file.')
              with packed.extractfile(members[0]) as source, binary.open('xb') as target:
                  shutil.copyfileobj(source, target)
          actual_binary = digest(binary)
          require(actual_binary == os.environ['PROOF_BINARY_SHA256'], 'Final worker digest mismatch.')
          binary.chmod(0o700)

          # The only worker command in this workflow. No YAML, target, or grant is passed.
          clean_env = {key: value for key, value in os.environ.items()
                       if key in ('PATH', 'LANG', 'TMPDIR')}
          result = subprocess.run([str(binary), '--capabilities'], cwd=scratch, env=clean_env,
                                  capture_output=True, timeout=15, check=False)
          require(result.returncode == 0, 'Worker capabilities command failed.')
          require(len(result.stdout) <= 65536, 'Worker capability response is too large.')
          try:
              capabilities = json.loads(result.stdout)
          except (ValueError, UnicodeDecodeError):
              raise SystemExit('Worker capability response is not JSON.')
          require(isinstance(capabilities, dict), 'Worker capabilities must be an object.')
          require(type(capabilities.get('schema_version')) is int and capabilities['schema_version'] == 1,
                  'Unsupported worker capability schema.')
          require(type(capabilities.get('execution_manifest_version')) is int
                  and capabilities['execution_manifest_version'] == 1, 'Unsupported execution manifest.')
          for feature in ('multi_scenario_parallel', 'multi_scenario_phase',
                          'multi_scenario_authorization', 'multi_scenario_resolved_load_contract'):
              require(capabilities.get(feature) is True, 'Final worker lacks required multi capability: ' + feature)

          receipt = {'schema_version': 1, 'os': 'linux', 'arch': 'amd64',
                     'binary_sha256': actual_binary, 'capabilities': capabilities}
          evidence = {'proof_id': os.environ['PROOF_ID'], 'repository': os.environ['GITHUB_REPOSITORY'],
                      'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                      'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'archive_sha256': expected_archive}
          output = pathlib.Path('capability-proof-output')
          output.mkdir(exist_ok=False)
          (output / 'relampo-worker.capabilities.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          (output / 'proof-context.json').write_text(json.dumps(evidence, sort_keys=True) + '\n')
          (output / 'relampo-worker.sha256').write_text(actual_binary + '  relampo-worker\n')
          print('Exact Linux/amd64 worker capability receipt created. No load was executed.')
          PY

      - name: Upload the exact binary capability receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relampo-worker-capability-proof-${{ inputs.proof_id }}
          path: capability-proof-output/
          if-no-files-found: error
          retention-days: 7
