name: RLP-781 native packaging proof
run-name: RLP-781 source-free packaging proof ${{ inputs.proof_id }}
'on':
  workflow_dispatch:
    inputs:
      proof_id:
        description: Root-approved task proof ID
        required: true
        type: string
      manifest_sha256:
        description: Exact reviewed payload manifest SHA256
        required: true
        type: string
      archive_sha256:
        description: Exact compressed final worker SHA256
        required: true
        type: string
      binary_sha256:
        description: Exact final worker SHA256; actual version 0.0.0-next
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-packaging-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact task ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install native Go for metadata only
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install the pinned existing OSS GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.14.3
          install-only: true
      - name: Prove actual packaging without compilation, load, or upload
        timeout-minutes: 8
        shell: bash
        env:
          RLP781_PAYLOAD_ROOT: ${{ github.workspace }}/.relampo/rlp781-native-proof
          PROOF_ID: ${{ inputs.proof_id }}
          PROOF_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PROOF_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PROOF_BINARY_SHA256: ${{ inputs.binary_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RLP781_PAYLOAD_ROOT/proof-output"
          bash "$RLP781_PAYLOAD_ROOT/run-native.sh" 2>&1 | tee "$RLP781_PAYLOAD_ROOT/proof-output/native.log"
      - name: Upload proof evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rlp781-native-packaging-proof-${{ inputs.proof_id }}
          path: |
            .relampo/rlp781-native-proof/proof-output/
            .relampo/rlp781-native-proof/manifest.json
            .relampo/rlp781-native-proof/packaging/.goreleaser.yaml
            .relampo/rlp781-native-proof/packaging/.goreleaser-rlp781-proof.json
            .relampo/rlp781-native-proof/packaging/fixture-diff.json
            .relampo/rlp781-native-proof/frozen-files.json
            .relampo/rlp781-native-proof/packaging/dist/checksums.txt
            .relampo/rlp781-native-proof/packaging/dist/relampo-worker_linux_amd64.capabilities.json
            .relampo/rlp781-native-proof/packaging/dist/relampo-worker_0.0.0-next_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
